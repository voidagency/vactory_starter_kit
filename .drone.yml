name: default
kind: pipeline
type: docker

steps:
  - name: phpcs
    image: docker/compose:1.29.2
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
      - name: cache
        path: /workspace
    commands:
      - echo $${DRONE_SOURCE_BRANCH}
      - echo $${DRONE_TARGET_BRANCH}
      - docker build --no-cache -f ./Dockerfile --build-arg SOURCE_BRANCH_ID=$${DRONE_SOURCE_BRANCH} --build-arg TARGET_BRANCH_ID=$${DRONE_TARGET_BRANCH} -t vactory_starter_kit/build . 2>&1 | tee /workspace/phpcs.txt
  - name: code-analysis
    image: vactory/sonar-node-plugin:latest
    settings:
      sonar_host:
        from_secret: sonar_host
      sonar_token:
        from_secret: sonar_token
      use_node_version: 20.11.1
  - name: phpunit
    image: docker/compose:1.29.2
    environment:
      BITBUCKET_AUTHTOKEN:
        from_secret: BITBUCKET_AUTHTOKEN
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
      - name: cache
        path: /workspace
    commands:
      - echo $${DRONE_SOURCE_BRANCH}
      - echo $${DRONE_COMMIT}
      - echo $${BITBUCKET_AUTHTOKEN}
      - docker build -f .ci/Dockerfile --build-arg DRONE_SOURCE_BRANCH=$${DRONE_SOURCE_BRANCH} --build-arg DRONE_COMMIT=$${DRONE_COMMIT} --build-arg BITBUCKET_AUTHTOKEN=$${BITBUCKET_AUTHTOKEN} -t test-vactory:latest ./.ci # TODO: use commit hash instead of latest
      - docker run --rm test-vactory:latest 2>&1 | tee /workspace/phpunit.txt
  - name: clean-up
    image: docker/compose:1.29.2
    depends_on:
      - phpunit
    commands:
      - docker image rm test-vactory:latest
  - name: analyze
    image: ubuntu:latest
    environment:
      CURSOR_API_KEY:
        from_secret: cursor_api_key
    commands:
      - cat /workspace/phpcs.txt
      - cat /workspace/phpunit.txt
volumes:
  - name: docker_sock
    host:
      path: /var/run/docker.sock
  - name: cache
    temp: {}