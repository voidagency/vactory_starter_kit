  - name: notify
    image: plugins/slack-blame
    failure: ignore
    depends_on:
      - setup
    settings:
      token:
        from_secret: SLACK_TOKEN
      # channel: test-drone-ci
      success_template: |
        {{#if ${DRONE_PULL_REQUEST} }}
          ✅ <https://github.com/{{ repo.owner }}/{{ repo.name }}/pull/${DRONE_PULL_REQUEST}|Pull Request #${DRONE_PULL_REQUEST}>
        {{else}}
          ✅ {{ uppercasefirst build.status }}: Build #{{ build.number }} (type: `{{ build.event }}`)
        {{/if}}
        Commit: <${CI_REPO_LINK}/commits/{{ build.commit }}|{{ truncate build.commit 8 }}>
        Branch: <${CI_REPO_LINK}/commits/${DRONE_SOURCE_BRANCH}|${DRONE_SOURCE_BRANCH}>
        Author: ${DRONE_COMMIT_AUTHOR}
        <${DRONE_BUILD_LINK}|Visit build page ↗>
      success_icon: ":happy_keanu:"
      failure_template: |
        The build is broken! Blame {{slack.name}}

        Commit: <${CI_REPO_LINK}/commits/{{ build.commit }}|{{ truncate build.commit 8 }}>
        Branch: <${CI_REPO_LINK}/commits/${DRONE_SOURCE_BRANCH}|${DRONE_SOURCE_BRANCH}>
        Author: ${DRONE_COMMIT_AUTHOR}
        <${DRONE_BUILD_LINK}|Visit build page ↗>
      failure_icon: ":sad_keanu:"
    when:
      status: [failure]
volumes:
  - name: docker_sock
    host:
      path: /var/run/docker.sock
  - name: sonar_cache
    host:
      path: /var/cache/sonar
  - name: composer_cache
    host:
      path: /var/cache/composer