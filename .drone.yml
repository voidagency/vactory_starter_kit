name: default
kind: pipeline
type: docker

clone:
  disable: true

workspace:
  path: /opt-cache

# One build per commit: push events only. A push to a PR branch also sent a
# pull_request event, and the two identical builds running at the same time
# regularly hung in SonarQube. pull_request events are not reliably delivered
# (no build on new commits of most PRs), push events always are.
trigger:
  event:
    exclude:
      - pull_request

steps:
  - name: setup
    image: vactory/vactory-ci:latest
    pull: if-not-exists
    environment:
      BITBUCKET_AUTHTOKEN:
        from_secret: BITBUCKET_AUTHTOKEN
      SONAR_TOKEN:
        from_secret: SONAR_TOKEN
      SLACK_TOKEN:
        from_secret: SLACK_TOKEN
      PHP_VERSION: 8.3
      COMPOSER_VERSION: 2.7.1
      DRUSH_VERSION: 8.4.1
