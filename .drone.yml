name: default
kind: pipeline
type: docker

clone:
  disable: true

workspace:
  path: /opt-cache

# One build per change: pushes to 3.x and pull requests. A push to a PR
# branch also sends a pull_request event; building both ran two identical
# builds at the same time, and one of them regularly hung in SonarQube.
trigger:
  ref:
    - refs/heads/3.x
    - refs/pull/**

steps:
  - name: setup
    image: vactory/vactory-ci:latest
    pull: if-not-exists
    environment:
      BITBUCKET_AUTHTOKEN:
        from_secret: BITBUCKET_AUTHTOKEN
      SONAR_TOKEN:
        from_secret: SONAR_TOKEN
      SLACK_TOKEN:
        from_secret: SLACK_TOKEN
      # Read-only GitHub token: composer downloads without it get HTTP 429.
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
      PHP_VERSION: 8.3
      COMPOSER_VERSION: 2.7.1
      DRUSH_VERSION: 8.4.1

---
# TEST (Redmine #71371): the same Sonar analysis in its own step, on a native
# arm64 image, to check whether the scanner still hangs outside Rosetta.
# Not to be merged as is.
name: sonar-arm64
kind: pipeline
type: docker

trigger:
  ref:
    - refs/pull/**

steps:
  - name: code-analysis
    image: vactory/sonar-node-plugin:arm64-test
    pull: never
    settings:
      sonar_host:
        from_secret: sonar_host
      sonar_token:
        from_secret: sonar_token
      use_node_version: 22.23.4
