name: default
kind: pipeline
type: docker

clone:
  disable: true

workspace:
  path: /opt-cache

# One build per change: pushes to 3.x and pull requests. A push to a PR
# branch also sends a pull_request event; building both ran two identical
# builds at the same time, and one of them regularly hung in SonarQube.
trigger:
  ref:
    - refs/heads/3.x
    - refs/pull/**

steps:
  - name: setup
    # Native arm64 build of vactory-ci (built and published on demand by the
    # Drone pipeline of droneci): no Rosetta on the Apple Silicon CI machine,
    # about 25-35% faster, no git/JVM freezes (Redmine #71371).
    image: vactory/vactory-ci:arm64
    pull: if-not-exists
    environment:
      BITBUCKET_AUTHTOKEN:
        from_secret: BITBUCKET_AUTHTOKEN
      SONAR_TOKEN:
        from_secret: SONAR_TOKEN
      SLACK_TOKEN:
        from_secret: SLACK_TOKEN
      # Read-only GitHub token: composer downloads without it get HTTP 429.
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
      # Sonar runs in the "sonar" pipeline below, not in this step.
      SKIP_SONAR: "true"
      # Unit and kernel suites run during the site install, on their own database.
      PARALLEL_TESTS: "true"
      PHP_VERSION: 8.3
      COMPOSER_VERSION: 2.7.1
      DRUSH_VERSION: 8.4.1

---
# SonarQube analysis, in its own pipeline on a native arm64 image.
# The build image above is amd64 and runs under Rosetta on the CI Mac, where
# the scanner's JVM sometimes froze (Redmine #71371). The analysis only reads
# the sources, so it does not need the build image.
name: sonar
kind: pipeline
type: docker

# Runs only on the runner reserved for Sonar (label role:sonar on the CI
# machine): short analyses do not wait behind the "default" builds.
node:
  role: sonar

# The default clone merges the pull request into 3.x and fails on a
# conflict, before any analysis. Clone the commit of the build as it is.
clone:
  disable: true

trigger:
  ref:
    - refs/heads/3.x
    - refs/pull/**

steps:
  - name: clone
    image: drone/git
    pull: if-not-exists
    commands:
      - git init -q .
      - git remote add origin "$DRONE_GIT_HTTP_URL"
      - git fetch -q origin "+refs/heads/$DRONE_TARGET_BRANCH:refs/remotes/origin/$DRONE_TARGET_BRANCH"
      - git fetch -q origin "$DRONE_COMMIT_REF"
      - git checkout -q "$DRONE_COMMIT"
      - git log --oneline -1

  - name: code-analysis
    # Built for arm64 from droneci/sonar-node-plugin and pushed by hand to
    # Docker Hub (the Hub autobuild only produces the amd64 "latest" tag).
    image: vactory/sonar-node-plugin:arm64
    pull: if-not-exists
    settings:
      sonar_host:
        from_secret: sonar_host
      sonar_token:
        from_secret: sonar_token
      use_node_version: 22.23.4

---
# Checks of the pull request itself (Redmine #71766): an existing test
# assertion removed or rewritten without a "Changements de comportement" line
# in the CHANGELOG, and the title and description of the PR.
# Warning mode first: a missing item (code 1) or a check that could not run
# (code 2) is printed in the log and the build stays green. Set
# CHECKS_BLOCKING to "true" to make them fail the build.
name: pr-checks
kind: pipeline
type: docker

clone:
  disable: true

trigger:
  event:
    - pull_request

steps:
  - name: clone
    image: drone/git
    pull: if-not-exists
    commands:
      - git init -q .
      - git remote add origin "$DRONE_GIT_HTTP_URL"
      - git fetch -q origin "+refs/heads/$DRONE_TARGET_BRANCH:refs/remotes/origin/$DRONE_TARGET_BRANCH"
      - git fetch -q origin "$DRONE_COMMIT_REF"
      - git checkout -q "$DRONE_COMMIT"
      - git log --oneline -1

  - name: checks
    # Only bash, git, curl and jq are needed; the image is already on the CI
    # machine. With "commands", Drone runs them instead of the image entrypoint.
    image: vactory/vactory-ci:arm64
    pull: if-not-exists
    environment:
      CHECKS_BLOCKING: "false"
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
    commands:
      - bash scripts/ci/pr-checks.sh
