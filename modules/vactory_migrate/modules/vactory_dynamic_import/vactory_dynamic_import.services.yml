services:
  vactory_dynamic_import.helper:
    class: Drupal\vactory_dynamic_import\Service\DynamicImportHelpers
    arguments:
      - '@entity_field.manager'
      - '@language_manager'
      - '@entity_type.manager'
      - '@config.factory'
  vactory_dynamic_import.term_normalization:
    class: Drupal\vactory_dynamic_import\Service\TermNormalizationService
    arguments: ['@transliteration']