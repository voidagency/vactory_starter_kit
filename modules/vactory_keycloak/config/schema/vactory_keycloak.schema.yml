vactory_keycloak.settings:
  type: config_object
  label: 'Social Auth Keycloak settings'
  mapping:
    app_server_url:
      type: string
      label: 'Application Server URL'
    app_realm:
      type: string
      label: 'App Realm'
    client_id:
      type: string
      label: 'Client ID'
    client_secret:
      type: string
      label: 'Client Secret'
    scopes:
      type: string
      label: 'Scopes to be requested'
    endpoints:
      type: string
      label: 'API calls to be made to collect data'
    no_verify:
      type: boolean
      label: 'No cert verification'
