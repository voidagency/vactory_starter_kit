# Route pour afficher le rapport CSV
vactory_content_diff.csv_report:
  path: '/admin/content/diff/csv-report'
  defaults:
    _form: '\Drupal\vactory_content_diff\Form\ContentDiffCsvForm'
    _title: 'CSV Report'
  requirements:
    _permission: 'access content diff'
  options:
    _admin_route: true

# Route pour la comparaison détaillée
vactory_content_diff.compare:
  path: '/admin/content/diff/compare/{bundle}/{uuid}'
  defaults:
    _controller: '\Drupal\vactory_content_diff\Controller\ContentDiffCompareController::compare'
  requirements:
    _permission: 'administer content'
  options:
    parameters:
      bundle:
        type: string
      uuid:
        type: string