vactory_decoupled_router.vactory_route.*:
  type: config_entity
  label: 'Route config'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    path:
      type: string
      label: 'Path'
    alias:
      type: string
      label: 'Alias'

vactory_decoupled_router.settings:
  type: config_object
  label: 'Vactory decoupled router settings'
  mapping:
    page_entity_types:
      type: sequence
      label: 'Entity types resolved as pages'
      sequence:
        type: string
        label: 'Entity type ID'
