sonar.projectKey=vactory_starter_kit
com.sun.net.ssl.checkRevocation=false
java.net.useSystemProxies=true
sonar.sources=./
# TEMPORARY (Redmine #71371): analyse PHP sources only. The SonarJS Node.js
# bridge (used for JS/TS, JS in YAML/HTML and CSS) hangs intermittently in CI.
# Remove this line once the cause is fixed, before the security tickets.
sonar.inclusions=**/*.php,**/*.module,**/*.inc,**/*.install,**/*.theme,**/*.profile
sonar.exclusions=documentation/**,.github/**,config/**,**/tests/**,**/*Test.php,**/*.min.js,**/*.wasm,**/tailwindcss-iso.js,**/react*.js,**/babel*.js,modules/vactory_dynamic_block/js/*.min.js,modules/vactory_dynamic_block/js/react*.js,modules/vactory_dynamic_block/js/babel*.js,modules/vactory_dynamic_block/js/tailwindcss*.js,modules/vactory_dynamic_block/js/*.wasm
sonar.cpd.exclusions=**/tests/**,**/*Test.php
sonar.coverage.exclusions=modules/**/js/*.js,modules/**/modules/**/js/*.js
sonar.qualitygate.wait=true

# Ignore php:S100 rule (Method names should comply with naming convention)
# Ignore php:S1192 rule (String literals should not be duplicated)
# Ignore php:S1781 rule (true/false/null in lower case): the Drupal coding
# standard requires TRUE, FALSE and NULL in upper case.
sonar.issue.ignore.multicriteria=e1,e2,e3

# S100
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S100
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*

# S1192
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*

# S1781
sonar.issue.ignore.multicriteria.e3.ruleKey=php:S1781
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*
